name: release

# Fires when a GitHub Release is published, which release-please does when its
# release PR merges. Publishes the three registry packages; the Go module has
# no registry, and the `vX.Y.Z` tag release-please pushed is its release.
#
# Each registry gets its own job, so one misconfigured publisher cannot block
# the other two. If one fails, fix the cause and re-run this workflow by hand
# for just that registry: a version can only be uploaded once, so re-running
# the others fails loudly at the registry.
#
# All three use trusted publishing (OIDC). No registry token lives in this
# repository. Each registry ties its trusted publisher to this repository and
# this workflow file name, so renaming release.yml breaks publishing.
#
# No dependency caches here: a release job must not restore a cache that a
# pull request could have written.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      registry:
        description: Which registry to publish to
        type: choice
        options: [all, npm, pypi, rubygems]
        default: all

permissions:
  contents: read

# Registry uploads are single-writer, and a version can be uploaded once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish-npm:
    name: Publish to npm
    if: ${{ github.event_name == 'release' || inputs.registry == 'all' || inputs.registry == 'npm' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token npm trusted publishing exchanges for a
      # short-lived credential, and signs --provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # .tool-versions' Node 24 ships npm >= 11.5.1, which trusted publishing
      # needs.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      # Re-run the checks against the exact commit being published: releases
      # can also be cut by hand.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # ENEEDAUTH here means the trusted publisher on npmjs.com does not name
      # CruGlobal/cru-flags and release.yml.
      - run: npm publish --provenance --access public

  publish-pypi:
    name: Publish to PyPI
    if: ${{ github.event_name == 'release' || inputs.registry == 'all' || inputs.registry == 'pypi' }}
    runs-on: ubuntu-latest
    # Part of PyPI's trusted-publisher identity (repository + workflow +
    # environment). The environment is managed in cru-terraform.
    environment:
      name: pypi
      url: https://pypi.org/project/cru-flags/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Read Python version from .tool-versions
        id: python-version
        run: echo "version=$(awk '/^python /{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ steps.python-version.outputs.version }}
          activate-environment: true
          enable-cache: false
      - run: uv pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - run: python -m build --outdir dist-python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-python

  publish-rubygems:
    name: Publish to RubyGems
    if: ${{ github.event_name == 'release' || inputs.registry == 'all' || inputs.registry == 'rubygems' }}
    runs-on: ubuntu-latest
    permissions:
      # rubygems/release-gem asks for write; the Rakefile's `release` task
      # pushes no tag (release-please owns tagging), so nothing is written.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false
      - run: bundle install
      - run: bundle exec rake
      # Runs `bundle exec rake release`: build, guard_clean, rubygem_push.
      - uses: rubygems/release-gem@v1
